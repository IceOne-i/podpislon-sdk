name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Opt in to Node.js 24 for all JavaScript actions (Node 20 is deprecated;
  # default switches on 2026-06-02 and Node 20 is removed 2026-09-16).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
        include:
          - python-version: "3.12"
            os: windows-latest
          - python-version: "3.12"
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # hatch-vcs needs the full git history to derive the version
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install package
        run: uv sync --python "${{ matrix.python-version }}" --extra dev --extra fastapi

      - name: Lint (ruff)
        run: uv run --no-sync ruff check src tests

      - name: Type-check (mypy)
        run: uv run --no-sync mypy src

      - name: Run tests
        run: uv run --no-sync pytest --cov=podpislon --cov-report=xml -ra

      - name: Upload coverage
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
